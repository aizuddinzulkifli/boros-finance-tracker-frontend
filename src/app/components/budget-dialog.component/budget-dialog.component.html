<h2 mat-dialog-title>{{ data ? 'Add Budget' : 'Edit Budget' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="budget-form">

  <mat-dialog-content class="dialog-content">

    <!-- Category -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <!--<input matInput formControlName="categoryId" >-->
      <mat-select formControlName="categoryId">
        <mat-option *ngFor="let category of categories" [value]="category.categoryId">{{category.name}}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Amount -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="Enter budget amount">
    </mat-form-field>

    <!-- Year -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Year</mat-label>
      <input matInput type="number" formControlName="year">
    </mat-form-field>

    <!-- Month -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Month</mat-label>
      <input matInput type="number" formControlName="month">
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions class="mat-dialog-actions-end">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">Save</button>
  </mat-dialog-actions >
</form>
