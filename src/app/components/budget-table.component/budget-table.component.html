<table mat-table [dataSource]="dataSource">

    <!-- Category Column -->
    <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let e">
            {{e.categoryName}}
        </td>
    </ng-container>

    <!-- Budget Column -->
    <ng-container matColumnDef="budget">
        <th mat-header-cell *matHeaderCellDef>Allocated</th>
        <td mat-cell *matCellDef="let e">
            {{e.budgetAmount}}
        </td>
    </ng-container>

    <!-- Spent Column -->
    <ng-container matColumnDef="spent">
        <th mat-header-cell *matHeaderCellDef>Spent</th>
        <td mat-cell *matCellDef="let e">
            {{e.spentAmount}}
        </td>
    </ng-container>

    <!-- Remaining Column -->
    <ng-container matColumnDef="remaining">
        <th mat-header-cell *matHeaderCellDef>Remaining</th>
        <td mat-cell *matCellDef="let e">
            {{e.remainingAmount}}
        </td>
    </ng-container>
    
    <!-- Status Column -->
    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let e">

            <mat-progress-bar
                [value]="e.percentUsed"
                [color]="getColor(e.status)">
            </mat-progress-bar>
            <span>{{e.percentUsed}}%</span>
            <span class="status-label" [ngClass]="e.status">{{e.status}}</span>
        </td>
    </ng-container>

    <!--<ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let e">
            <button mat-icon-button color="primary">
                            <mat-icon>edit</mat-icon>
                        </button>
        </td>
    </ng-container>-->

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    

</table>
